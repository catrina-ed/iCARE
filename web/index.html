<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>iCare</title>
    <meta name="description" content="Coordinate medications, appointments, tasks, and care notes across the family care circle." />

    <!-- Paints the browser chrome cocoa so the page does not sit in a white frame. -->
    <meta name="theme-color" content="#1B1815" />
    <meta name="color-scheme" content="dark" />

    <!-- Inter Tight for body, Instrument Sans for headlines and big numbers.
         Both fall back to the system stack if the fonts do not load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS ignores the manifest for Add to Home Screen; these drive it instead. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="iCare" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
